
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - ResumeIQ</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/config.js" defer></script>
    <script src="js/auth.js" defer></script>
</head>
<body class="auth-page">

<a href="index.html" class="logo auth-logo">Resume<span>IQ</span></a>

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-heading">
            <span class="tag">JOIN RESUMEIQ</span>
            <h1>Create Your Account</h1>
            <p>Start improving your resume with AI.</p>
        </div>

        <form id="registerForm">
            <label>Full Name</label>
            <input type="text" id="registerName" placeholder="Your full name" required>

            <label>Email Address</label>
            <input type="email" id="registerEmail" placeholder="Your email address" required>

            <label>Password</label>
            <input type="password" id="registerPassword" placeholder="Create a password" required minlength="8">

            <p id="authMessage" class="message"></p>

            <button type="submit" class="btn btn-primary full-width">
                Create Account
            </button>
        </form>

        <p class="auth-switch">
            Already have an account?
            <a href="login.html">Login here</a>
        </p>
    </div>
</div>

</body>
</html>
