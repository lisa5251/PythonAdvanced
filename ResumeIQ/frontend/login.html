
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ResumeIQ</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/config.js" defer></script>
    <script src="js/auth.js" defer></script>
</head>
<body class="auth-page">

<a href="index.html" class="logo auth-logo">Resume<span>IQ</span></a>

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-heading">
            <span class="tag">WELCOME BACK</span>
            <h1>Login to ResumeIQ</h1>
            <p>Access your resume analysis dashboard.</p>
        </div>

        <form id="loginForm">
            <label>Email Address</label>
            <input type="email" id="loginEmail" placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" id="loginPassword" placeholder="Enter your password" required>

            <p id="authMessage" class="message"></p>

            <button type="submit" class="btn btn-primary full-width">
                Login
            </button>
        </form>

        <p class="auth-switch">
            Don't have an account?
            <a href="register.html">Create an account</a>
        </p>
    </div>
</div>

</body>
</html>
